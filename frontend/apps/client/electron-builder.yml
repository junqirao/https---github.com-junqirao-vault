appId: com.vault.client
productName: Vault
copyright: Copyright © 2026 Vault

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  # 排除 node_modules。
  #
  # 为什么可以排除：渲染层依赖（react / antd / dayjs …）已经被 vite 打包进 dist/assets 的
  # 单个 js 里，主进程只 require electron 与 node 内置模块（见 dist-electron/*.js），
  # 所以运行时不需要任何 npm 包。而 electron-builder 默认会把 package.json 的
  # dependencies 原样复制进 app.asar —— 对我们这种"前端全打包"的 Electron 应用来说，
  # 那是整整 76 MB 的死重量（app.asar 会从约 2 MB 涨到约 79 MB）。
  # 若将来主进程真的要 require 某个包，把对应依赖移回 package.json 的 dependencies 并去掉
  # 这一行排除即可。
  - '!node_modules/**/*'
  # 注意：@vault/ui 这类 workspace 链接包**不受**上面这条规则约束（electron-builder 对它有
  # 单独的"复制链接包"路径，实测加 '!node_modules/@vault/**/*' 也拦不住，app.asar 里仍会多出
  # 约 0.7 MB 的 .tsx/.json 源码）。所以包的 package.json 里 dependencies 是空的：渲染层依赖
  # 一律放 devDependencies —— electron-builder 只复制 dependencies，devDependencies 一概不进包。

# 只保留界面真正支持的语言包（locales/*.pak）。
#
# 为什么：Electron 运行时自带 55 个语言的 .pak，合计约 39 MB，而客户端界面只提供
# 简体中文 / English / 日本語 / 한국어（真源是 @vault/ui 的 LANGUAGES）。语言包只影响
# Chromium 自带的原生 UI（右键菜单、原生对话框按钮等），界面文案由 @vault/ui 的 i18n 提供，
# 所以删掉其余语言不会让界面缺字，只是让"系统语言不在白名单"的机器上原生控件回退英文。
#
# 名称必须与 locales/ 下的文件名一致（去掉 .pak）且用 Electron 的 locale 代码
# （ja / ko 没有地区后缀）。写错的后果是"该语言被杀掉"，不会报错——改这里请顺手核对一遍
# LANGUAGES。
electronLanguages:
  - en-US
  - zh-CN
  - ja
  - ko

# 打包收尾：许可文件外链化（删掉约 9 MB 的 LICENSES.chromium.html，换成给出官方
# 在线地址的小 NOTICE 文件）。详见 scripts/after-pack.cjs 里的合规说明。
afterPack: ./scripts/after-pack.cjs

# 把 Vault-Agent.exe 放进安装目录根（即 Vault.exe 同级）。
# 客户端主进程启动时会在"主程序同目录"查找该代理，找不到则进入降级模式
# （界面能开，但无法挂载 iSCSI 存储库）。
# 源文件由 build.py 在调用 electron-builder 之前从 dist/ 复制到 build/ 下。
extraFiles:
  - from: build/Vault-Agent.exe
    to: Vault-Agent.exe

electronVersion: 32.2.0

win:
  # 应用图标（同时用于 exe、任务栏与窗口）：512×512 PNG，electron-builder 会转成 .ico。
  icon: build/icon.png

  # 客户端默认需要管理员权限运行。
  #
  # 原因：挂载/卸载存储库要执行 AttachVirtualDisk、diskpart、iscsicli 等需要管理员
  # 权限的操作。把要求写进 Vault.exe 的清单（requireAdministrator）后，双击时会由
  # UAC 直接提权，用户不必再手动"以管理员身份运行"；代理由 Vault.exe 派生，因此同样
  # 具备管理员权限，不会再返回 agent.admin_required。
  requestedExecutionLevel: requireAdministrator

  # 只产出可直接运行的程序目录（release/win-unpacked），**不做安装包**。
  #
  # 原因：
  #   1. 客户端就是"electron 打包出来的程序"，解压双击 Vault.exe 即用，无需安装；
  #   2. 跳过 nsis/portable 目标可以免去下载 NSIS 工具链（GitHub Releases 在
  #      部分网络下不可达，会导致构建失败）。
  # 如将来确实需要安装包，把 target 改回 nsis 即可。
  target:
    - target: dir
      arch:
        - x64
